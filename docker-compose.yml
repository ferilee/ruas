services:
  mariadb:
    image: mariadb:11.4
    container_name: ruas-mariadb
    restart: always
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-3308}:3306'
    environment:
      MARIADB_DATABASE: ${DB_NAME:-ruas_belajar}
      MARIADB_USER: ruas
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ferileenet

  ruas:
    build:
      context: .
      dockerfile: Dockerfile
    image: ruas:production
    container_name: ruas
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:${APP_PORT:-3000}'
    working_dir: /app/backend
    command: ['bun', 'src/index.ts']
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ruas
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      DB_NAME: ${DB_NAME:-ruas_belajar}
      APP_PORT: ${APP_PORT:-3000}
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      EXAM_EXIT_PASSWORD: ${EXAM_EXIT_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN wajib diisi di .env}
      NODE_ENV: production
    networks:
      - ferileenet

networks:
  ferileenet:
    external: true

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RUAS_DATA_DIR:-/srv/data/ruas}/mariadb
