services:
  mariadb:
    image: mariadb:11.4
    container_name: ruas-mariadb
    restart: unless-stopped
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-3308}:3306'
    environment:
      MARIADB_DATABASE: ${DB_NAME:-ruas_belajar}
      MARIADB_USER: ruas
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}
    volumes:
      - ruas_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ferileenet

  ruas:
    image: oven/bun:1.3.14
    container_name: ruas
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:${APP_PORT:-3000}'
    volumes:
      - ./frontend/dist:/app/frontend/dist
      - ./backend:/app/backend
      - ./seed.json:/app/seed.json
    working_dir: /app/backend
    command: ['bun', 'src/index.ts']
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ruas
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      DB_NAME: ${DB_NAME:-ruas_belajar}
      APP_PORT: ${APP_PORT:-3000}
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NODE_ENV: production
    networks:
      - ferileenet

networks:
  ferileenet:
    external: true

volumes:
  ruas_mariadb_data:
