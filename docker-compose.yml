services:
  ruas:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${RUAS_IMAGE:-ruas:production}
    container_name: ruas
    restart: always
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:${APP_PORT:-3000}'
    working_dir: /app/backend
    command: ['bun', 'src/index.ts']
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:' + (process.env.APP_PORT || '3000') + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ruas
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      DB_NAME: ${DB_NAME:-ruas_belajar}
      APP_PORT: ${APP_PORT:-3000}
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      EXAM_EXIT_PASSWORD: ${EXAM_EXIT_PASSWORD:-}
      SCHOOL_NAME: ${SCHOOL_NAME:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN wajib diisi di .env}
      NODE_ENV: production
    networks:
      - ferileenet

networks:
  ferileenet:
    external: true
